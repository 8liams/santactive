[theme]
base                   = "light"
primaryColor           = "#1A3D8F"
backgroundColor        = "#FAFAF8"
secondaryBackgroundColor = "#F3F2EC"
textColor              = "#0A1938"
font                   = "sans serif"

[server]
headless               = true
address                = "0.0.0.0"
enableCORS             = false
enableXsrfProtection   = true
enableStaticServing    = true   # /app/static/… : index de recherche JSON chargé par le navigateur

[browser]
gatherUsageStats       = false
